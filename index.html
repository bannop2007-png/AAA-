<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>NIGHTMARE OPERATOR | Тактический шутер</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            background: radial-gradient(circle at 20% 30%, #03050b, #000000);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', 'Inter', 'Orbitron', monospace;
            overflow: hidden;
            margin: 0;
            padding: 20px;
        }

        /* игровой контейнер */
        .game-container {
            position: relative;
            border-radius: 28px;
            box-shadow: 0 25px 40px rgba(0, 0, 0, 0.6), 0 0 0 2px rgba(212, 175, 55, 0.2);
            background: #0a0c14;
        }

        canvas {
            display: block;
            margin: 0 auto;
            border-radius: 24px;
            cursor: crosshair;
            box-shadow: inset 0 0 30px rgba(0, 0, 0, 0.5);
        }

        /* HUD — панель stats */
        .hud {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
            pointer-events: none;
            font-family: 'Orbitron', 'Inter', monospace;
            text-shadow: 0 0 4px #00a6ff40;
        }

        .stats {
            background: rgba(0, 0, 0, 0.65);
            backdrop-filter: blur(10px);
            padding: 10px 20px;
            border-radius: 60px;
            border-left: 3px solid #f0b90b;
            font-weight: 700;
            letter-spacing: 1px;
        }

        .stats span {
            color: #f5c542;
            font-size: 1.4rem;
            font-weight: 800;
            margin-right: 8px;
        }

        .stats .label {
            color: #bbb;
            font-size: 0.8rem;
            text-transform: uppercase;
        }

        .restart-btn {
            pointer-events: auto;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(8px);
            border: 1px solid #f5b81b;
            color: #f5b81b;
            padding: 8px 22px;
            border-radius: 60px;
            font-weight: bold;
            cursor: pointer;
            font-family: inherit;
            transition: 0.2s;
            font-size: 0.9rem;
        }

        .restart-btn:hover {
            background: #f5b81b;
            color: #0a0c14;
            box-shadow: 0 0 12px #f5b81b;
            transform: scale(1.02);
        }

        .wave-badge {
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(8px);
            padding: 8px 20px;
            border-radius: 40px;
            font-weight: bold;
            color: #ffd966;
        }

        .controls-hint {
            position: absolute;
            bottom: 16px;
            left: 20px;
            background: rgba(0,0,0,0.55);
            backdrop-filter: blur(5px);
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 11px;
            color: #ccc;
            pointer-events: none;
            font-family: monospace;
        }

        @media (max-width: 1100px) {
            body { padding: 10px; }
            .stats { padding: 5px 14px; }
            .stats span { font-size: 1.1rem; }
        }
    </style>
</head>
<body>
<div class="game-container">
    <canvas id="gameCanvas" width="1200" height="700" style="width:100%; height:auto; max-width:1200px; aspect-ratio:1200/700"></canvas>
    <div class="hud">
        <div class="stats">
            <span id="killCount">0</span> <span class="label">УНИЧТОЖЕНО</span>
        </div>
        <div class="wave-badge" id="waveDisplay">
            ВОЛНА 1
        </div>
        <div class="stats">
            <span id="healthValue">❤️ 100</span>
        </div>
        <button class="restart-btn" id="restartGameBtn">⚡ РЕСТАРТ</button>
    </div>
    <div class="controls-hint">
        🎮 WASD — движение | 🖱️ МЫШЬ — прицел | 🔫 ЛКМ — стрельба
    </div>
</div>

<script>
    (function(){
        // --- CANVAS & GLOBALS ---
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Размеры
        let W = 1200, H = 700;
        canvas.width = W;
        canvas.height = H;

        // Game state
        let gameRunning = true;
        let score = 0;          // количество убийств
        let wave = 1;
        let enemiesAlive = 0;
        let enemiesToSpawn = 0;
        let waveInProgress = true;
        let waveTransitionTimer = 0; // пауза между волнами

        // --- ИГРОК ---
        const player = {
            x: W/2,
            y: H/2,
            radius: 18,
            health: 100,
            maxHealth: 100,
            invincibleTimer: 0,   // секунды (в кадрах ~60fps)
            speed: 4.8
        };

        // --- ДИНАМИЧЕСКИЕ МАССИВЫ ---
        let enemies = [];
        let bullets = [];
        let particles = [];

        // ОРУЖИЕ
        let shootCooldown = 0;
        const SHOOT_DELAY_FRAMES = 12;  // ~ 200ms при 60fps
        let mouseX = player.x, mouseY = player.y;

        // Параметры врагов (базовые)
        let enemyBaseSpeed = 1.1;
        let enemyBaseHealth = 1;
        let enemyBaseRadius = 16;

        // Helper functions
        function clamp(value, min, max) { return Math.min(max, Math.max(min, value)); }

        // --- ВРАГИ: структура ---
        class Enemy {
            constructor(x, y, speed, hp, radius) {
                this.x = x;
                this.y = y;
                this.speed = speed;
                this.hp = hp;
                this.maxHp = hp;
                this.radius = radius;
                this.color = `hsl(${Math.floor(Math.random() * 20 + 340)}, 70%, 55%)`; // красные оттенки
            }
            update(playerX, playerY) {
                const dx = playerX - this.x;
                const dy = playerY - this.y;
                const len = Math.hypot(dx, dy);
                if(len > 0.01) {
                    const move = this.speed;
                    this.x += (dx / len) * move;
                    this.y += (dy / len) * move;
                }
            }
            draw(ctx) {
                ctx.save();
                ctx.shadowBlur = 12;
                ctx.shadowColor = "#ff3a3a";
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI*2);
                ctx.fillStyle = this.color;
                ctx.fill();
                ctx.strokeStyle = "#9a2f2f";
                ctx.lineWidth = 1.5;
                ctx.stroke();
                // глаза злые
                ctx.beginPath();
                ctx.fillStyle = "white";
                ctx.arc(this.x-5, this.y-3, 4, 0, Math.PI*2);
                ctx.arc(this.x+5, this.y-3, 4, 0, Math.PI*2);
                ctx.fill();
                ctx.fillStyle = "#0a0a0a";
                ctx.arc(this.x-5, this.y-4, 2, 0, Math.PI*2);
                ctx.arc(this.x+5, this.y-4, 2, 0, Math.PI*2);
                ctx.fill();
                ctx.restore();
                // полоска хп если более 1
                if(this.hp > 1) {
                    const hpPercent = this.hp / this.maxHp;
                    ctx.fillStyle = "#c0392b";
                    ctx.fillRect(this.x-12, this.y-this.radius-5, 24, 4);
                    ctx.fillStyle = "#2ecc71";
                    ctx.fillRect(this.x-12, this.y-this.radius-5, 24 * hpPercent, 4);
                }
            }
        }

        // --- ПУЛЯ ---
        class Bullet {
            constructor(x, y, angle, speed=9) {
                this.x = x;
                this.y = y;
                this.vx = Math.cos(angle) * speed;
                this.vy = Math.sin(angle) * speed;
                this.radius = 4;
                this.life = true;
            }
            update() {
                this.x += this.vx;
                this.y += this.vy;
                if(this.x < -30 || this.x > W+30 || this.y < -30 || this.y > H+30) this.life = false;
            }
            draw(ctx) {
                ctx.save();
                ctx.shadowBlur = 8;
                ctx.shadowColor = "#f5cb5c";
                ctx.beginPath();
                ctx.arc(this.x, this.y, 4, 0, Math.PI*2);
                ctx.fillStyle = "#ffdd77";
                ctx.fill();
                ctx.beginPath();
                ctx.arc(this.x, this.y, 2, 0, Math.PI*2);
                ctx.fillStyle = "white";
                ctx.fill();
                ctx.restore();
            }
        }

        // --- ЧАСТИЦЫ (кровь/искры) ---
        function addParticles(x, y, color, count=6) {
            for(let i=0;i<count;i++) {
                particles.push({
                    x: x, y: y, vx: (Math.random() - 0.5)*4, vy: (Math.random() - 0.5)*4,
                    life: 0.8, color: color || "#ff6a4d", size: Math.random()*3+2
                });
            }
        }

        // --- СПАВН ВРАГОВ (по волнам) ---
        function startWave(waveNumber) {
            const baseCount = Math.min(3 + Math.floor(waveNumber * 0.8), 14) + (waveNumber >= 4 ? 2 : 0);
            let enemyCount = baseCount;
            if(waveNumber > 6) enemyCount = 9 + Math.floor(waveNumber/2);
            if(enemyCount > 22) enemyCount = 22;
            enemiesToSpawn = enemyCount;
            enemiesAlive = enemyCount;
            // увеличиваем сложность: скорость, здоровье
            let bonusSpeed = Math.min(0.6, (waveNumber-1) * 0.08);
            let extraHp = (waveNumber >= 3) ? Math.floor(waveNumber/3) : 0;
            for(let i=0; i<enemyCount; i++) {
                let side = Math.floor(Math.random() * 4);
                let spawnX, spawnY;
                const padding = 45;
                if(side === 0) { spawnX = Math.random() * W; spawnY = -padding; }
                else if(side === 2) { spawnX = Math.random() * W; spawnY = H + padding; }
                else if(side === 1) { spawnX = W + padding; spawnY = Math.random() * H; }
                else { spawnX = -padding; spawnY = Math.random() * H; }
                let speedVal = enemyBaseSpeed + bonusSpeed + (Math.random() * 0.4);
                let hpVal = 1 + extraHp;
                if(waveNumber >= 5 && Math.random() < 0.25) hpVal += 1;
                let rad = enemyBaseRadius + (hpVal > 1 ? 2 : 0);
                enemies.push(new Enemy(spawnX, spawnY, speedVal, hpVal, rad));
            }
            waveInProgress = true;
        }

        // завершение волны
        function finishWave() {
            wave++;
            waveInProgress = false;
            waveTransitionTimer = 70; // ~1.2 секунды пауза
            document.getElementById('waveDisplay').innerText = `ВОЛНА ${wave}`;
            // дополнительное лечение после волны (малое)
            player.health = Math.min(player.maxHealth, player.health + 15);
            updateHealthDisplay();
        }

        // --- ОБНОВЛЕНИЕ ИГРЫ ---
        function updateGame() {
            if(!gameRunning) return;

            // таймер неуязвимости
            if(player.invincibleTimer > 0) player.invincibleTimer--;

            // Пауза между волнами
            if(waveTransitionTimer > 0) {
                waveTransitionTimer--;
                if(waveTransitionTimer === 0) {
                    startWave(wave);
                }
                return; // в паузе нет движения врагов/стрельбы
            }

            // Если волна активна, но врагов нет и нет активных врагов, завершаем волну
            if(waveInProgress && enemies.length === 0 && enemiesToSpawn === 0) {
                finishWave();
                return;
            }

            // 1. Движение игрока (WASD)
            let moveX = 0, moveY = 0;
            if(keys['w'] || keys['ArrowUp']) moveY -= 1;
            if(keys['s'] || keys['ArrowDown']) moveY += 1;
            if(keys['a'] || keys['ArrowLeft']) moveX -= 1;
            if(keys['d'] || keys['ArrowRight']) moveX += 1;
            if(moveX !== 0 || moveY !== 0) {
                const len = Math.hypot(moveX, moveY);
                moveX /= len;
                moveY /= len;
            }
            let newX = player.x + moveX * player.speed;
            let newY = player.y + moveY * player.speed;
            player.x = clamp(newX, player.radius + 5, W - player.radius - 5);
            player.y = clamp(newY, player.radius + 5, H - player.radius - 5);

            // 2. Стрельба (кулдаун)
            if(shootCooldown > 0) shootCooldown--;
            if(mousePressed && gameRunning && shootCooldown === 0 && waveTransitionTimer === 0) {
                const angle = Math.atan2(mouseY - player.y, mouseX - player.x);
                bullets.push(new Bullet(player.x, player.y, angle, 11));
                shootCooldown = SHOOT_DELAY_FRAMES;
                // звуковой эффект (без звука, но вибрация пуль)
            }

            // 3. Обновление пуль
            for(let i=0; i<bullets.length; i++) {
                bullets[i].update();
                if(!bullets[i].life) {
                    bullets.splice(i,1);
                    i--;
                }
            }

            // 4. Обновление врагов + коллизия с игроком
            for(let i=0; i<enemies.length; i++) {
                const e = enemies[i];
                e.update(player.x, player.y);
                // столкновение с игроком
                const distToPlayer = Math.hypot(e.x - player.x, e.y - player.y);
                if(distToPlayer < e.radius + player.radius && player.invincibleTimer === 0 && gameRunning) {
                    const dmg = 14 + Math.floor(wave/3);
                    player.health -= dmg;
                    player.invincibleTimer = 25;  // ~0.4 сек
                    updateHealthDisplay();
                    addParticles(player.x, player.y, "#ffaa55", 12);
                    // отталкивание врага
                    const angle = Math.atan2(e.y - player.y, e.x - player.x);
                    e.x += Math.cos(angle) * 28;
                    e.y += Math.sin(angle) * 28;
                    if(player.health <= 0) {
                        gameRunning = false;
                        player.health = 0;
                        updateHealthDisplay();
                        return;
                    }
                }
            }

            // 5. Коллизия пуль с врагами
            for(let i=0; i<bullets.length; i++) {
                const bullet = bullets[i];
                let hit = false;
                for(let j=0; j<enemies.length; j++) {
                    const enemy = enemies[j];
                    const dist = Math.hypot(bullet.x - enemy.x, bullet.y - enemy.y);
                    if(dist < bullet.radius + enemy.radius) {
                        hit = true;
                        enemy.hp -= 1;
                        addParticles(bullet.x, bullet.y, "#ff8844", 5);
                        if(enemy.hp <= 0) {
                            // убийство
                            enemies.splice(j,1);
                            score++;
                            enemiesAlive--;
                            document.getElementById('killCount').innerText = score;
                            addParticles(enemy.x, enemy.y, "#ff4444", 12);
                        }
                        break;
                    }
                }
                if(hit) {
                    bullets.splice(i,1);
                    i--;
                }
            }

            // Обновление частиц
            for(let i=0; i<particles.length; i++) {
                particles[i].x += particles[i].vx;
                particles[i].y += particles[i].vy;
                particles[i].life -= 0.025;
                if(particles[i].life <= 0) {
                    particles.splice(i,1);
                    i--;
                }
            }

            // Дополнительно: если игра окончена, не продолжаем
        }

        // --- ОТРИСОВКА ВСЕГО ---
        function draw() {
            ctx.clearRect(0, 0, W, H);
            // Тёмный градиентный фон
            const grad = ctx.createLinearGradient(0, 0, W, H);
            grad.addColorStop(0, "#03050f");
            grad.addColorStop(1, "#0c1120");
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, W, H);
            // сетка (tech)
            ctx.strokeStyle = "#2a2f3f";
            ctx.lineWidth = 0.5;
            for(let i=0; i<W; i+=50){
                ctx.beginPath();
                ctx.moveTo(i,0);
                ctx.lineTo(i,H);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(0,i%H);
                ctx.lineTo(W,i%H);
                ctx.stroke();
            }
            
            // Враги
            for(let e of enemies) e.draw(ctx);
            // Пули
            for(let b of bullets) b.draw(ctx);
            // Частицы
            for(let p of particles) {
                ctx.globalAlpha = p.life * 0.9;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI*2);
                ctx.fillStyle = p.color;
                ctx.fill();
                ctx.globalAlpha = 1;
            }
            
            // Игрок (элитный шутер-стиль)
            ctx.save();
            ctx.shadowBlur = 16;
            ctx.shadowColor = "#2ad4ff";
            ctx.beginPath();
            ctx.arc(player.x, player.y, player.radius, 0, Math.PI*2);
            ctx.fillStyle = "#3a86ff";
            ctx.fill();
            ctx.beginPath();
            ctx.arc(player.x, player.y, player.radius-4, 0, Math.PI*2);
            ctx.fillStyle = "#80b3ff";
            ctx.fill();
            // прицел-точка игрока
            ctx.beginPath();
            ctx.arc(player.x, player.y, 5, 0, Math.PI*2);
            ctx.fillStyle = "white";
            ctx.fill();
            // шлем/броня
            ctx.beginPath();
            ctx.moveTo(player.x-8, player.y-6);
            ctx.lineTo(player.x, player.y-14);
            ctx.lineTo(player.x+8, player.y-6);
            ctx.fillStyle = "#ffcc44";
            ctx.fill();
            ctx.restore();

            // индикатор направления мыши (прицел)
            ctx.beginPath();
            ctx.moveTo(mouseX-10, mouseY);
            ctx.lineTo(mouseX+10, mouseY);
            ctx.moveTo(mouseX, mouseY-10);
            ctx.lineTo(mouseX, mouseY+10);
            ctx.strokeStyle = "#f0c45a";
            ctx.lineWidth = 2;
            ctx.stroke();
            ctx.beginPath();
            ctx.arc(mouseX, mouseY, 8, 0, Math.PI*2);
            ctx.strokeStyle = "#ffaa33";
            ctx.setLineDash([4,6]);
            ctx.stroke();
            ctx.setLineDash([]);

            // Полоска здоровья над игроком
            const healthPercent = player.health / player.maxHealth;
            ctx.fillStyle = "#2c2c2c";
            ctx.fillRect(player.x-25, player.y-player.radius-12, 50, 7);
            ctx.fillStyle = "#e63946";
            ctx.fillRect(player.x-25, player.y-player.radius-12, 50 * healthPercent, 7);
            ctx.fillStyle = "#f1c40f";
            ctx.fillRect(player.x-25, player.y-player.radius-12, 50 * healthPercent, 3);
            
            // Текст волны, если пауза
            if(waveTransitionTimer > 0 && !waveInProgress) {
                ctx.font = "bold 28monospace";
                ctx.shadowBlur = 0;
                ctx.fillStyle = "#ffe6a3";
                ctx.shadowColor = "black";
                ctx.fillText(`⚔️ ВОЛНА ${wave} ⚔️`, W/2-120, H/2-40);
                ctx.font = "16px monospace";
                ctx.fillStyle = "#c9b16b";
                ctx.fillText("ПРИГОТОВИТЬСЯ...", W/2-85, H/2+20);
            }
            
            // Game Over экран
            if(!gameRunning) {
                ctx.fillStyle = "rgba(0,0,0,0.85)";
                ctx.fillRect(0,0,W,H);
                ctx.font = "bold 48px 'Orbitron', monospace";
                ctx.fillStyle = "#e43f3f";
                ctx.shadowBlur = 0;
                ctx.fillText("GAME OVER", W/2-150, H/2-50);
                ctx.font = "24px monospace";
                ctx.fillStyle = "#f0b27a";
                ctx.fillText(`Уничтожено: ${score}  |  Волна: ${wave-1}`, W/2-200, H/2+30);
                ctx.font = "18px monospace";
                ctx.fillStyle = "#ddb582";
                ctx.fillText("Нажмите [РЕСТАРТ] для новой битвы", W/2-180, H/2+100);
            }
        }

        // --- ОБНОВЛЕНИЕ ЗДОРОВЬЯ В HUD ---
        function updateHealthDisplay() {
            const heartSpan = document.getElementById('healthValue');
            if(heartSpan) heartSpan.innerHTML = `❤️ ${Math.floor(player.health)}`;
        }

        // --- ПЕРЕЗАПУСК ИГРЫ (полный сброс) ---
        function restartGame() {
            gameRunning = true;
            score = 0;
            wave = 1;
            enemies = [];
            bullets = [];
            particles = [];
            player.health = player.maxHealth;
            player.x = W/2;
            player.y = H/2;
            player.invincibleTimer = 0;
            document.getElementById('killCount').innerText = "0";
            document.getElementById('waveDisplay').innerText = "ВОЛНА 1";
            updateHealthDisplay();
            waveInProgress = false;
            waveTransitionTimer = 10; // быстрый старт
            enemiesAlive = 0;
            enemiesToSpawn = 0;
            shootCooldown = 0;
            // запускаем первую волну
            setTimeout(() => {
                if(waveTransitionTimer <= 0 && !waveInProgress) startWave(1);
            }, 50);
            if(waveTransitionTimer === 0) startWave(1);
        }

        // --- УПРАВЛЕНИЕ (клавиши + мышь)---
        const keys = {
            w: false, a: false, s: false, d: false,
            ArrowUp: false, ArrowLeft: false, ArrowDown: false, ArrowRight: false
        };
        let mousePressed = false;

        function handleKeyDown(e) {
            const key = e.key;
            if(keys.hasOwnProperty(key)) keys[key] = true;
            // предотвращаем скролл
            if(['w','a','s','d','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(key))
                e.preventDefault();
        }
        function handleKeyUp(e) {
            const key = e.key;
            if(keys.hasOwnProperty(key)) keys[key] = false;
        }
        function handleMouseMove(e) {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            let canvasX = (e.clientX - rect.left) * scaleX;
            let canvasY = (e.clientY - rect.top) * scaleY;
            canvasX = clamp(canvasX, 0, W);
            canvasY = clamp(canvasY, 0, H);
            mouseX = canvasX;
            mouseY = canvasY;
        }
        function handleMouseDown(e) {
            if(e.button === 0) {
                mousePressed = true;
                e.preventDefault();
            }
        }
        function handleMouseUp(e) {
            if(e.button === 0) mousePressed = false;
        }
        function preventContext(e) { e.preventDefault(); }
        
        // --- АНИМАЦИОННЫЙ ЦИКЛ ---
        let lastTimestamp = 0;
        function gameLoop() {
            if(gameRunning) updateGame();
            draw();
            requestAnimationFrame(gameLoop);
        }
        
        // Инициализация событий
        window.addEventListener('load', () => {
            restartGame();   // первый старт
            updateHealthDisplay();
            // события
            window.addEventListener('keydown', handleKeyDown);
            window.addEventListener('keyup', handleKeyUp);
            canvas.addEventListener('mousemove', handleMouseMove);
            canvas.addEventListener('mousedown', handleMouseDown);
            window.addEventListener('mouseup', handleMouseUp);
            canvas.addEventListener('contextmenu', preventContext);
            document.getElementById('restartGameBtn').addEventListener('click', () => {
                restartGame();
            });
            gameLoop();
        });
        
        // ресайз коррекция координат мыши при изменении размера canvas (css-масштаб)
        window.addEventListener('resize', () => {});
    })();
</script>
</body>
</html>
