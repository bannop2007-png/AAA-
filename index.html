<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Premium Landing</title>

<meta name="description" content="Премиум сайт для бизнеса">

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #0b0b12;
  color: #fff;
}

.container {
  max-width: 1200px;
  margin: auto;
  padding: 20px;
}

.hero {
  height: 100vh;
  display: flex;
  flex-direction: column;
  justify-content: center;
}

h1 {
  font-size: 48px;
  background: linear-gradient(90deg,#00f,#0ff);
  -webkit-background-clip: text;
  color: transparent;
}

button {
  padding: 15px 30px;
  border: none;
  border-radius: 10px;
  background: linear-gradient(45deg,#00f,#0ff);
  color: #fff;
  cursor: pointer;
  transition: .3s;
}

button:hover {
  transform: scale(1.05);
  box-shadow: 0 0 20px #0ff;
}

.section {
  padding: 80px 0;
}

.cards {
  display: flex;
  gap: 20px;
  flex-wrap: wrap;
}

.card {
  flex: 1;
  min-width: 250px;
  padding: 20px;
  border-radius: 15px;
  background: rgba(255,255,255,0.05);
  backdrop-filter: blur(10px);
}

input, textarea {
  width: 100%;
  padding: 10px;
  margin-top: 10px;
  border-radius: 8px;
  border: none;
}
</style>
</head>

<body>

<div class="container hero">
  <h1 class="title">Создаем сайты, которые продают</h1>
  <p>Премиум дизайн + максимальная конверсия</p>
  <button onclick="scrollToForm()">Оставить заявку</button>
</div>

<div class="container section">
  <h2>Преимущества</h2>
  <div class="cards">
    <div class="card">🚀 Быстро</div>
    <div class="card">💎 Премиум дизайн</div>
    <div class="card">📈 Рост продаж</div>
  </div>
</div>

<div class="container section">
  <h2>Отзывы</h2>
  <p>“Сайт окупился за 2 недели”</p>
</div>

<div class="container section" id="form">
  <h2>Оставить заявку</h2>
  <input placeholder="Имя">
  <input placeholder="Телефон">
  <textarea placeholder="Сообщение"></textarea>
  <button onclick="send()">Отправить</button>
</div>

<script>

gsap.from(".title", {
  opacity: 0,
  y: 100,
  duration: 1.5
});

function scrollToForm(){
  document.getElementById("form").scrollIntoView({behavior:"smooth"});
}

function send(){
  alert("Заявка отправлена!");
}

</script>

</body>
</html>
