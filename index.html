<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AAA Site</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: #0a0a0f;
  color: white;
  overflow-x: hidden;
}

/* Loader */
#loader {
  position: fixed;
  width: 100%;
  height: 100%;
  background: black;
  display: flex;
  justify-content: center;
  align-items: center;
  z-index: 999;
}

.glow {
  color: #0ff;
  text-shadow: 0 0 20px #0ff;
}

/* Hero */
.hero {
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  flex-direction: column;
  text-align: center;
}

button {
  padding: 15px 40px;
  border: none;
  background: linear-gradient(45deg, #00f, #0ff);
  color: white;
  border-radius: 10px;
  cursor: pointer;
  transition: 0.3s;
}

button:hover {
  transform: scale(1.1);
  box-shadow: 0 0 20px #0ff;
}

/* Sections */
.section {
  padding: 100px 20px;
  text-align: center;
}

/* Glass */
.card {
  background: rgba(255,255,255,0.05);
  backdrop-filter: blur(20px);
  margin: 20px;
  padding: 30px;
  border-radius: 20px;
  display: inline-block;
}
</style>
</head>

<body>

<div id="loader"><h1 class="glow">LOADING...</h1></div>

<div class="hero">
  <h1 class="glow title">AAA EXPERIENCE</h1>
  <button onclick="scrollToNext()">START</button>
</div>

<div class="section">
  <h2>Features</h2>
  <div class="card">Ultra Graphics</div>
  <div class="card">Smooth Animations</div>
  <div class="card">AAA UX</div>
</div>

<div class="section">
  <h2>Showcase</h2>
  <p>Next-gen experience</p>
</div>

<div class="section">
  <h2>Join Now</h2>
  <button onclick="alert('Started!')">Play</button>
</div>

<script>

// Loader
window.onload = () => {
  gsap.to("#loader", {
    opacity: 0,
    duration: 1,
    onComplete: () => document.getElementById("loader").style.display = "none"
  });
};

// Animations
gsap.from(".title", {
  opacity: 0,
  y: 100,
  duration: 1.5
});

// Scroll
function scrollToNext() {
  window.scrollTo({
    top: window.innerHeight,
    behavior: "smooth"
  });
}

// Parallax
window.addEventListener("scroll", () => {
  document.body.style.backgroundPositionY = window.scrollY * 0.5 + "px";
});

</script>

</body>
</html>
