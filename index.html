<!DOCTYPE html>

<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Velvet Drive</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

<script defer src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

<script defer src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
    font-family:Inter,sans-serif;
    background:#0A0A0C;
    color:#fff;
    overflow-x:hidden;
}

.container{max-width:1300px;margin:auto;padding:0 20px}

.header{
    position:fixed;
    width:100%;
    top:0;
    z-index:1000;
    padding:20px;
    transition:.3s;
}
.header.scrolled{
    background:rgba(0,0,0,0.8);
    backdrop-filter:blur(10px);
}

.nav{display:flex;justify-content:space-between;align-items:center}

.logo{font-weight:800;font-size:24px;color:#D4AF37}

.nav-links{display:flex;gap:25px;list-style:none}
.nav-links a{color:#fff;text-decoration:none}

.burger{display:none;cursor:pointer;font-size:22px}

.hero{
    height:100vh;
    display:flex;
    align-items:center;
}

.btn{
    background:#D4AF37;
    border:none;
    padding:14px 30px;
    cursor:pointer;
    font-weight:700;
}

.cars-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
    gap:25px;
}

.card{
    background:#111;
    padding:15px;
    border-radius:20px;
    transition:.3s;
}
.card:hover{transform:translateY(-10px)}

img{width:100%;border-radius:15px}

section{padding:100px 0}

@media(max-width:768px){
.nav-links{
position:fixed;
top:0;
right:-100%;
width:70%;
height:100vh;
background:#000;
flex-direction:column;
justify-content:center;
align-items:center;
transition:.3s;
}
.nav-links.active{right:0}
.burger{display:block}
}
</style>

</head>

<body>

<header class="header" id="header">
<div class="container nav">
<div class="logo">VELVET DRIVE</div>

<ul class="nav-links" id="navLinks">
<li><a href="#home">Главная</a></li>
<li><a href="#fleet">Авто</a></li>
</ul>

<div class="burger" id="burger"><i class="fas fa-bars"></i></div>
</div>
</header>

<section class="hero container" id="home">
<div>
<h1>Премиум аренда авто</h1>
<p>Лучшие автомобили мира</p>
<button class="btn" id="exploreBtn">Выбрать авто</button>
</div>
</section>

<section id="fleet">
<div class="container">
<h2>Автопарк</h2>

<div class="cars-grid">

<div class="card">
<img src="https://images.pexels.com/photos/337909/pexels-photo-337909.jpeg">
<h3>Ferrari</h3>
<p>$1000 / день</p>
</div>

<div class="card">
<img src="https://images.pexels.com/photos/1082565/pexels-photo-1082565.jpeg">
<h3>Lamborghini</h3>
<p>$1500 / день</p>
</div>

<div class="card">
<img src="https://images.pexels.com/photos/164634/pexels-photo-164634.jpeg">
<h3>Mercedes</h3>
<p>$900 / день</p>
</div>

</div>
</div>
</section>

<script>
document.addEventListener("DOMContentLoaded", function(){

// GSAP безопасный запуск
if(typeof gsap !== "undefined"){
    gsap.registerPlugin(ScrollTrigger);

    gsap.from(".hero h1",{opacity:0,y:-20,duration:1});
    gsap.from(".hero p",{opacity:0,y:20,duration:1,delay:.3});
}

// header scroll
const header=document.getElementById("header");
window.addEventListener("scroll",()=>{
header.classList.toggle("scrolled",window.scrollY>20)
},{passive:true});

// burger
const burger=document.getElementById("burger");
const nav=document.getElementById("navLinks");

burger.onclick=()=>nav.classList.toggle("active");

// scroll button
document.getElementById("exploreBtn").onclick=()=>{
document.getElementById("fleet").scrollIntoView({behavior:"smooth"})
};

});
</script>

</body>
</html>
