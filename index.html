<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Premium Site</title>

<meta name="description" content="Премиум сайт">

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: Arial, sans-serif;
}

body {
  background: linear-gradient(135deg,#0a0a0f,#111827);
  color: #fff;
  overflow-x: hidden;
}

/* Loader */
#loader {
  position: fixed;
  width: 100%;
  height: 100%;
  background: #000;
  display: flex;
  justify-content: center;
  align-items: center;
  z-index: 999;
  font-size: 24px;
}

/* Container */
.container {
  max-width: 1100px;
  margin: auto;
  padding: 20px;
}

/* Hero */
.hero {
  height: 100vh;
  display: flex;
  flex-direction: column;
  justify-content: center;
}

h1 {
  font-size: 48px;
  background: linear-gradient(90deg,#00f,#0ff);
  -webkit-background-clip: text;
  color: transparent;
}

p {
  margin: 20px 0;
  opacity: 0.8;
}

/* Button */
button {
  padding: 15px 30px;
  border: none;
  border-radius: 10px;
  background: linear-gradient(45deg,#00f,#0ff);
  color: white;
  cursor: pointer;
  transition: 0.3s;
}

button:hover {
  transform: scale(1.05);
  box-shadow: 0 0 20px #0ff;
}

/* Sections */
.section {
  padding: 80px 0;
}

/* Cards */
.cards {
  display: flex;
  gap: 20px;
  flex-wrap: wrap;
}

.card {
  flex: 1;
  min-width: 250px;
  padding: 20px;
  border-radius: 15px;
  background: rgba(255,255,255,0.05);
  backdrop-filter: blur(10px);
}

/* Form */
input, textarea {
  width: 100%;
  padding: 12px;
  margin-top: 10px;
  border-radius: 8px;
  border: none;
  outline: none;
}

/* Footer */
footer {
  text-align: center;
  padding: 30px;
  opacity: 0.5;
}

/* Mobile */
@media(max-width:768px){
  h1 { font-size: 32px; }
}
</style>
</head>

<body>

<div id="loader">Загрузка...</div>

<div class="container hero">
  <h1 class="title">Создаем сайты, которые продают</h1>
  <p>Премиум дизайн + высокая конверсия</p>
  <button onclick="scrollToForm()">Оставить заявку</button>
</div>

<div class="container section">
  <h2>Преимущества</h2>
  <div class="cards">
    <div class="card">🚀 Быстрая загрузка</div>
    <div class="card">💎 Дорогой дизайн</div>
    <div class="card">📈 Рост продаж</div>
  </div>
</div>

<div class="container section">
  <h2>Отзывы</h2>
  <p>“Сайт реально начал приносить клиентов”</p>
</div>

<div class="container section" id="form">
  <h2>Оставить заявку</h2>
  <input id="name" placeholder="Имя">
  <input id="phone" placeholder="Телефон">
  <textarea id="msg" placeholder="Сообщение"></textarea>
  <button onclick="send()">Отправить</button>
</div>

<footer>
  © 2026 Premium Site
</footer>

<script>

/* Loader */
window.onload = () => {
  gsap.to("#loader", {
    opacity: 0,
    duration: 1,
    onComplete: () => {
      document.getElementById("loader").style.display = "none";
    }
  });
};

/* Animations */
gsap.from(".title", {
  opacity: 0,
  y: 100,
  duration: 1.5
});

/* Scroll */
function scrollToForm(){
  document.getElementById("form").scrollIntoView({
    behavior: "smooth"
  });
}

/* Form */
function send(){
  let name = document.getElementById("name").value;
  let phone = document.getElementById("phone").value;

  if(name === "" || phone === ""){
    alert("Заполни имя и телефон");
    return;
  }

  alert("Заявка отправлена!");
}

/* Parallax */
window.addEventListener("scroll", () => {
  document.body.style.backgroundPositionY =
    window.scrollY * 0.3 + "px";
});

</script>

</body>
</html>
